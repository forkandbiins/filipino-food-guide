<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="css/style.css">

<body>

    <!-- ========================= -->

    <!-- ========================= -->

            <div class="brand">

            <nav>

                <ul>

                    <li><a href="index.html">Home</a></li>

                    <li>
